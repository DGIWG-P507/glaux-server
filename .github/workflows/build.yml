name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}

# Every check lane runs on its own fresh runner in parallel. The ruleset requires
# only the final `Rust bootstrap` job, which fails unless every lane listed in its
# reviewed set ran and succeeded. GitHub accepts skipped required checks, so that
# gate is unconditional and treats skipped, cancelled or missing lanes as failure.
# Each lane repeats checkout, commit identity and pinned-toolchain setup. The
# suite lanes build every target before their time-limited suites; the static
# lane keeps the original build step. A job listed in neither the gate's
# reviewed list nor its `needs` is NOT gated, so review every new job.

jobs:
  static-checks:
    name: "CI lane: formatting, lint, build and inventory"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact task commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; MIT
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Identify the checked-out commit and runner
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          printf 'Tested commit: %s\nRunner image: %s %s\n' "$TESTED_HEAD" "$ImageOS" "$ImageVersion"
          uname -a
          cc --version
          python3 --version
      - name: Select the pinned toolchain on the hosted runner
        shell: bash
        run: |
          bootstrap_toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$bootstrap_toolchain" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version
      - name: Fetch the locked dependency archives
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaux-ci-evidence"
          cargo fetch --locked
          git diff --exit-code -- Cargo.lock
          cargo tree --locked --offline -p glaux-server --target x86_64-unknown-linux-gnu -e normal,build > "$RUNNER_TEMP/glaux-ci-evidence/server-linux-dependencies.txt"
      - name: Record candidate exact-number dependency inventory
        run: python3 scripts/cargo_inventory.py --candidate > "$RUNNER_TEMP/glaux-ci-evidence/cargo-candidate.json"
      - name: Verify formatting and locked dependencies
        shell: bash
        run: |
          if ! cargo fmt --all --check; then
            cargo fmt --all
            git diff -- '*.rs' > "$RUNNER_TEMP/glaux-ci-evidence/rustfmt.patch"
            exit 1
          fi
          python3 scripts/cargo_inventory.py > "$RUNNER_TEMP/glaux-ci-evidence/cargo-dependencies.json"
          python3 scripts/renderer_inventory.py > "$RUNNER_TEMP/glaux-ci-evidence/renderer-inventory.json"
          python3 crates/glaux-standards/src/units/verify.py --self-test | tee "$RUNNER_TEMP/glaux-ci-evidence/ucum-inventory.log"
          git diff --exit-code -- Cargo.lock
      - name: Lint Rust and check Python syntax
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          python3 -m compileall -q scripts
      - name: Build all three packages
        run: cargo build --workspace --locked --offline
      - name: Verify original corpus digests before this lane's checks
        shell: bash
        run: python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-before.log"
      - name: Check package boundaries and test discovery
        run: python3 scripts/check-bootstrap.py
      - name: Fetch the pinned disposable database image
        shell: bash
        run: |
          docker version
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from database_harness import PIN, docker; print(PIN); print(docker("pull", "--platform", PIN["platform"], PIN["image"], timeout=180))'
      - name: Inventory resolved dependencies and licence evidence
        run: python3 scripts/dependency_inventory.py > "$RUNNER_TEMP/glaux-ci-evidence/dependency-inventory.json"
      - name: Verify original corpus digests after this lane's checks
        shell: bash
        run: python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-after.log"
      - name: Preserve actual execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; MIT
        with:
          name: ci-evidence-static-checks
          path: ${{ runner.temp }}/glaux-ci-evidence/
          if-no-files-found: error
          retention-days: 14

  rust-suites:
    name: "CI lane: Rust tests, parser campaigns and value faults"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the exact task commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; MIT
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
