name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-bootstrap:
    name: Rust bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      TESTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact task commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; MIT
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Identify the checked-out commit and runner
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$TESTED_HEAD"
          printf 'Tested commit: %s\nRunner image: %s %s\n' "$TESTED_HEAD" "$ImageOS" "$ImageVersion"
          uname -a
          cc --version
          python3 --version
      - name: Select the pinned toolchain on the hosted runner
        shell: bash
        run: |
          bootstrap_toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$bootstrap_toolchain" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version
      - name: Prepare unapproved task 9 dependency and formatting candidate
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaux-ci-evidence"
          cargo fetch
          cargo fmt --all
          cp Cargo.lock "$RUNNER_TEMP/glaux-ci-evidence/Cargo.lock"
          git diff -- '*.rs' > "$RUNNER_TEMP/glaux-ci-evidence/rustfmt.patch"
          python3 scripts/cargo_inventory.py --candidate > "$RUNNER_TEMP/glaux-ci-evidence/cargo-dependencies.json"
          cargo test -p glaux-domain --locked --offline -- --nocapture
          echo 'Candidate evidence only: lock and inventory require review; this is not acceptance.'
          exit 1
      - name: Fetch the locked dependency archives
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaux-ci-evidence"
          cargo fetch --locked
          git diff --exit-code -- Cargo.lock
      - name: Verify formatting and locked dependencies
        shell: bash
        run: |
          if ! cargo fmt --all --check; then
            cargo fmt --all
            git diff -- '*.rs' > "$RUNNER_TEMP/glaux-ci-evidence/rustfmt.patch"
            exit 1
          fi
          python3 scripts/cargo_inventory.py > "$RUNNER_TEMP/glaux-ci-evidence/cargo-dependencies.json"
          git diff --exit-code -- Cargo.lock
      - name: Lint Rust and check Python syntax
        run: |
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
          python3 -m compileall -q scripts
      - name: Build all three packages
        run: cargo build --workspace --locked --offline
      - name: Check package boundaries and test discovery
        run: python3 scripts/check-bootstrap.py
      - name: Run initial tests and applicable doctests
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaux-ci-evidence"
          python3 -u scripts/check-execution.py rust | tee "$RUNNER_TEMP/glaux-ci-evidence/rust.log"
      - name: Exercise the bounded schema-parser mutation campaign
        shell: bash
        run: python3 -u scripts/check-execution.py schema-fuzz | tee "$RUNNER_TEMP/glaux-ci-evidence/schema-fuzz.log"
      - name: Prove public identity type boundaries and wrong-acceptance detection
        shell: bash
        run: |
          python3 -u scripts/check_identity_boundary.py | tee "$RUNNER_TEMP/glaux-ci-evidence/identity-boundary.log"
          python3 -u scripts/test-identity-failures.py
      - name: Fetch the pinned disposable database image
        shell: bash
        run: |
          docker version
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from database_harness import PIN, docker; print(PIN); print(docker("pull", "--platform", PIN["platform"], PIN["image"], timeout=180))'
      - name: Check original corpus and offline fault controls
        shell: bash
        run: |
          python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus.log"
          python3 -u scripts/test_corpus.py 2>&1 | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-controls.log"
      - name: Exercise real database lifecycle and failure cases
        shell: bash
        run: |
          python3 -u scripts/check-execution.py database | tee "$RUNNER_TEMP/glaux-ci-evidence/database.log"
      - name: Verify required execution rejects disposable failures
        run: python3 -u scripts/test-ci-failures.py
      - name: Verify validation assertions detect disposable faults
        run: python3 -u scripts/test-validation-failures.py
      - name: Inventory resolved dependencies and licence evidence
        run: python3 scripts/dependency_inventory.py > "$RUNNER_TEMP/glaux-ci-evidence/dependency-inventory.json"
      - name: Preserve actual execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; MIT
        with:
          name: initial-ci-evidence
          path: ${{ runner.temp }}/glaux-ci-evidence/
          if-no-files-found: error
          retention-days: 14
