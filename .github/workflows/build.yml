  rust-bootstrap:
    # This job's name is the ruleset's required check. Keep it unconditional.
    name: Rust bootstrap
    if: ${{ always() }}
    needs: [static-checks, rust-suites, listener-proofs, database-storage, database-service, ci-controls]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every reviewed check lane to have run and succeeded
        env:
          LANE_RESULTS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          # Reviewed set of required lanes. A lane in only one of this list and
          # `needs` fails the gate. A job in neither is not gated at all, so
          # every new check job must be added to both.
          expected = [
              "static-checks", "rust-suites", "listener-proofs",
              "database-storage", "database-service", "ci-controls",
          ]
          reported = json.loads(os.environ["LANE_RESULTS"])
          results = {name: value.get("result") for name, value in reported.items()}
          print(json.dumps(results, indent=2, sort_keys=True))
          problems = [
              name + ": " + str(results.get(name, "missing from needs"))
              for name in expected if results.get(name) != "success"
          ]
          unexpected = sorted(set(results) - set(expected))
          if unexpected:
              problems.append("not in the reviewed lane list: " + ", ".join(unexpected))
          if problems:
              sys.exit("Required lanes did not all succeed: " + "; ".join(problems))
          print("All " + str(len(expected)) + " required lanes succeeded.")
          PY
