          cc --version
          python3 --version
      - name: Select the pinned toolchain on the hosted runner
        shell: bash
        run: |
          bootstrap_toolchain="$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$bootstrap_toolchain" --profile minimal --component rustfmt --component clippy
          rustup show active-toolchain
          rustc --version --verbose
          cargo --version --verbose
      - name: Fetch the locked dependency archives
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/glaux-ci-evidence"
          cargo fetch --locked
          git diff --exit-code -- Cargo.lock
      - name: Build every workspace target before time-limited suites
        run: cargo build --workspace --all-targets --locked --offline
      - name: Verify original corpus digests before projection execution
        shell: bash
        run: python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-before.log"
      - name: Run initial tests and applicable doctests
        shell: bash
        run: python3 -u scripts/check-execution.py rust | tee "$RUNNER_TEMP/glaux-ci-evidence/rust.log"
      - name: Exercise the bounded schema-parser mutation campaign
        shell: bash
        run: python3 -u scripts/check-execution.py schema-fuzz | tee "$RUNNER_TEMP/glaux-ci-evidence/schema-fuzz.log"
      - name: Prove public identity type boundaries and wrong-acceptance detection
        shell: bash
        run: |
          python3 -u scripts/check_identity_boundary.py | tee "$RUNNER_TEMP/glaux-ci-evidence/identity-boundary.log"
          python3 -u scripts/test-identity-failures.py
      - name: Exercise exact numeric parsing and detect lossy numeric faults
        shell: bash
        run: |
          python3 -u scripts/check-execution.py numeric-fuzz | tee "$RUNNER_TEMP/glaux-ci-evidence/numeric-fuzz.log"
          python3 -u scripts/test-numeric-failures.py
      - name: Exercise exact time parsing and detect time faults
        shell: bash
        run: |
          python3 -u scripts/check-execution.py time-fuzz | tee "$RUNNER_TEMP/glaux-ci-evidence/time-fuzz.log"
          python3 -u scripts/test-time-failures.py
      - name: Check original corpus and offline fault controls
        shell: bash
        run: |
          python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus.log"
          python3 -u scripts/test_corpus.py 2>&1 | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-controls.log"
      - name: Verify validation assertions detect disposable faults
        run: python3 -u scripts/test-validation-failures.py
      - name: Verify directional projection assertions detect disposable faults
        run: python3 -u scripts/test-projection-failures.py
      - name: Verify original corpus digests after projection execution
        shell: bash
        run: python3 -u scripts/check_corpus.py | tee "$RUNNER_TEMP/glaux-ci-evidence/corpus-after.log"
      - name: Preserve actual execution evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1; MIT
        with:
          name: ci-evidence-rust-suites
          path: ${{ runner.temp }}/glaux-ci-evidence/
          if-no-files-found: error
          retention-days: 14

