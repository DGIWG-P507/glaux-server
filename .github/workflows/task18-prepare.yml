name: Task 18 dependency preparation
on: pull_request
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Prepare reviewed candidate on hosted runner only
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/task18-preparation"
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
          cargo fetch
          cargo fmt --all
          git diff -- Cargo.lock '*.rs' > "$RUNNER_TEMP/task18-preparation/candidate.patch"
          python3 scripts/cargo_inventory.py --candidate > "$RUNNER_TEMP/task18-preparation/cargo-dependencies.json"
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: task18-preparation
          path: ${{ runner.temp }}/task18-preparation
          if-no-files-found: error
          retention-days: 14
