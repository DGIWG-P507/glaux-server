[workspace]
members = ["crates/glaux-domain", "crates/glaux-standards", "crates/glaux-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/DGIWG-P507/glaux-server"
publish = false

[workspace.dependencies]
fluent-uri = { version = "=0.4.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
glaux-domain = { path = "crates/glaux-domain" }
glaux-standards = { path = "crates/glaux-standards" }
jsonschema = { version = "=0.56.0", default-features = false }
num-bigint = { version = "=0.4.8", default-features = false }
num-rational = { version = "=0.4.2", default-features = false, features = ["num-bigint"] }
num-traits = { version = "=0.2.19", default-features = false }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
uuid = { version = "=1.26.1", default-features = false }
